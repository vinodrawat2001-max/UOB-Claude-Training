<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c2570c">
  <title>IT PMO | Project Delivery Board</title>
  <style>
    /* Design tokens */
    :root {
      color-scheme: light;
      --blue-950: #102a43;
      --blue-900: #173f67;
      --blue-800: #1f5686;
      --blue-700: #286da6;
      --blue-100: #eaf2f9;
      --blue-050: #f5f9fc;
      --ink: #1e2e3d;
      --muted: #647789;
      --line: #d6e0e9;
      --surface: #ffffff;
      --canvas: #f2f6f9;
      --critical: #b42318;
      --critical-bg: #fff0ef;
      --high: #a85d00;
      --high-bg: #fff5e5;
      --medium: #286da6;
      --medium-bg: #eaf2f9;
      --low: #667788;
      --low-bg: #eff2f5;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --radius: 6px;
      --shadow: 0 8px 24px rgb(16 42 67 / 12%);
    }

    /* Base and shared controls */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }
    button, input, select, textarea { font: inherit; }
    button, select { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid #66a6dc;
      outline-offset: 2px;
    }
    button:disabled { cursor: wait; opacity: .65; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Application header and live summary */
    .app-header {
      background: #c2570c;
      color: #fff;
      border-bottom: 4px solid #8f3e05;
    }
    .header-inner, main {
      width: min(1600px, 100%);
      margin-inline: auto;
      padding-inline: var(--space-6);
    }
    .header-inner { padding-block: var(--space-4) var(--space-3); }
    .topline { display: flex; justify-content: space-between; align-items: center; gap: var(--space-4); }
    .brand { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 1px solid rgb(255 255 255 / 42%);
      border-radius: var(--radius);
      color: #fff;
      font-weight: 800;
      letter-spacing: 0;
    }
    .brand-name { margin: 0; font-size: 30px; font-weight: 800; line-height: 1.1; }
    .brand-subtitle { margin: 2px 0 0; color: #fff3e6; font-size: 12px; }
    .header-actions { display: flex; align-items: center; gap: var(--space-3); }
    .refresh-note { color: #fff3e6; font-size: 12px; }
    .primary-button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: var(--space-2);
      min-height: 38px;
      padding: 8px 13px;
      border: 1px solid #8cbce0;
      border-radius: var(--radius);
      background: #fff;
      color: #8f3e05;
      font-weight: 700;
    }
    .primary-button:hover { background: var(--blue-100); }
    .summary-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-2) var(--space-5);
      margin-top: var(--space-4);
      padding-top: var(--space-3);
      border-top: 1px solid rgb(255 255 255 / 18%);
    }
    .summary-item { display: inline-flex; align-items: baseline; gap: 6px; color: #fff3e6; font-size: 12px; }
    .summary-item strong { color: #fff; font-size: 17px; font-variant-numeric: tabular-nums; }
    .summary-item.overdue strong { color: #fff; }

    /* Main content, filters, and board */
    main { padding-block: var(--space-5) var(--space-8); }
    .board-heading { display: flex; align-items: end; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-4); }
    .board-heading h1 { margin: 0; color: var(--blue-950); font-size: 21px; line-height: 1.2; }
    .board-heading p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-3);
      align-items: end;
      margin-bottom: var(--space-4);
      padding: var(--space-3) var(--space-4);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }
    .filter-field { display: grid; gap: 4px; min-width: 170px; }
    .filter-field label { color: var(--muted); font-size: 11px; font-weight: 700; }
    .filter-field input, .filter-field select {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      height: 34px;
      padding: 5px 9px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      color: var(--ink);
    }
    .clear-button, .secondary-button {
      min-height: 34px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      color: var(--blue-800);
      font-weight: 650;
    }
    .clear-button:hover, .secondary-button:hover { background: var(--blue-050); }
    .board {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      align-items: start;
      gap: var(--space-3);
    }
    .board-column {
      min-width: 0;
      min-height: 260px;
      padding: var(--space-2);
      border: 1px solid var(--line);
      border-top: 3px solid var(--blue-700);
      border-radius: var(--radius);
      background: #e8eef3;
      transition: background-color 120ms ease, border-color 120ms ease;
    }
    .board-column[data-status="Blocked"] { border-top-color: #597b98; }
    .board-column[data-status="Done"] { border-top-color: #3c7f79; }
    .board-column.is-drop-target { background: #dcebf7; border-color: var(--blue-700); }
    .column-header { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); padding: 3px 3px 10px; }
    .column-header h2 { margin: 0; color: var(--blue-950); font-size: 13px; }
    .count-badge { min-width: 24px; padding: 2px 7px; border-radius: 12px; background: #fff; color: var(--blue-800); text-align: center; font-size: 11px; font-weight: 750; }
    .card-list { display: grid; gap: var(--space-2); }
    .task-card {
      min-width: 0;
      padding: 10px;
      border: 1px solid #d4dee7;
      border-left: 4px solid var(--medium);
      border-radius: 4px;
      background: #fff;
      box-shadow: 0 1px 2px rgb(16 42 67 / 5%);
    }
    .task-card.priority-critical { border-left-color: var(--critical); }
    .task-card.priority-high { border-left-color: #d18a20; }
    .task-card.priority-medium { border-left-color: var(--medium); }
    .task-card.priority-low { border-left-color: #8795a2; }
    .task-card.is-dragging { opacity: .45; }
    .card-topline, .card-footer, .card-meta-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }
    .task-id { color: var(--muted); font-size: 10px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .card-title { margin: 6px 0 4px; color: var(--blue-950); font-size: 13px; line-height: 1.35; overflow-wrap: anywhere; }
    .project-name { margin: 0 0 9px; color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
    .priority-pill, .category-tag, .overdue-badge {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      max-width: 100%;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .priority-pill.critical { background: var(--critical-bg); color: var(--critical); }
    .priority-pill.high { background: var(--high-bg); color: var(--high); }
    .priority-pill.medium { background: var(--medium-bg); color: var(--medium); }
    .priority-pill.low { background: var(--low-bg); color: var(--low); }
    .overdue-badge { background: var(--critical-bg); color: var(--critical); }
    .card-meta-row { justify-content: flex-start; flex-wrap: wrap; margin-top: 9px; color: var(--muted); font-size: 11px; }
    .category-tag { background: #f0f4f7; color: #52687a; font-weight: 600; }
    .assignee { overflow-wrap: anywhere; }
    .card-footer { justify-content: space-between; margin-top: 11px; padding-top: 8px; border-top: 1px solid #edf1f4; }
    .due-date { color: #516678; font-size: 10px; }
    .card-actions { display: flex; align-items: center; gap: 6px; }
    .move-select {
      max-width: 115px;
      min-height: 27px;
      padding: 3px 5px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      color: var(--blue-800);
      font-size: 10px;
    }
    .icon-button {
      display: inline-grid;
      place-items: center;
      width: 27px;
      height: 27px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: #647789;
      font-size: 18px;
      line-height: 1;
    }
    .icon-button:hover { border-color: #e5b4b0; background: var(--critical-bg); color: var(--critical); }
    .delete-confirm { display: flex; align-items: center; justify-content: space-between; gap: 6px; width: 100%; color: var(--critical); font-size: 10px; font-weight: 700; }
    .delete-confirm button { padding: 3px 6px; border: 1px solid #e4aaa5; border-radius: 3px; background: #fff; color: var(--critical); font-size: 10px; font-weight: 700; }
    .empty-column { padding: 16px 8px; color: #718394; text-align: center; font-size: 11px; }
    .empty-filter { grid-column: 1 / -1; padding: 24px; border: 1px dashed #b7c6d2; border-radius: var(--radius); color: var(--muted); text-align: center; }

    /* Add-task dialog and validation */
    dialog {
      width: min(620px, calc(100vw - 28px));
      max-height: min(92vh, 820px);
      padding: 0;
      border: 1px solid #c5d2dd;
      border-radius: 7px;
      background: var(--surface);
      color: var(--ink);
      box-shadow: var(--shadow);
    }
    dialog::backdrop { background: rgb(16 42 67 / 48%); }
    .dialog-header { display: flex; align-items: center; justify-content: space-between; padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--line); background: var(--blue-050); }
    .dialog-header h2 { margin: 0; color: var(--blue-950); font-size: 17px; }
    .dialog-body { padding: var(--space-4) var(--space-5) var(--space-5); overflow-y: auto; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3) var(--space-4); }
    .form-field { display: grid; align-content: start; gap: 5px; min-width: 0; }
    .form-field.full-width { grid-column: 1 / -1; }
    .form-field label { color: #344b5f; font-size: 12px; font-weight: 700; }
    .form-field input, .form-field select, .form-field textarea {
      width: 100%;
      min-height: 37px;
      padding: 7px 9px;
      border: 1px solid #bdcbd7;
      border-radius: 4px;
      background: #fff;
      color: var(--ink);
    }
    .form-field textarea { min-height: 74px; resize: vertical; }
    .form-field [aria-invalid="true"] { border-color: var(--critical); }
    .field-error { min-height: 14px; color: var(--critical); font-size: 11px; }
    .form-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-3); }
    .submit-button { min-height: 37px; padding: 7px 13px; border: 1px solid var(--blue-800); border-radius: 4px; background: var(--blue-800); color: #fff; font-weight: 700; }
    .submit-button:hover { background: var(--blue-950); }

    /* Toast feedback */
    .toast-region {
      position: fixed;
      z-index: 5;
      right: var(--space-5);
      bottom: var(--space-5);
      display: grid;
      gap: var(--space-2);
      width: min(360px, calc(100vw - 32px));
    }
    .toast { padding: 11px 14px; border: 1px solid #b8d7ca; border-left: 4px solid #39836a; border-radius: 5px; background: #fff; color: #214f40; box-shadow: var(--shadow); animation: toast-in 160ms ease-out; }
    .toast.warning { border-color: #ead0a2; border-left-color: #a85d00; color: #704400; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }

    /* Phone-only controls: status tabs and filter toggle (hidden on larger screens) */
    .status-tabs, .filter-toggle { display: none; }

    /* Responsive layout */
    @media (max-width: 1050px) {
      .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 767px) {
      .header-inner, main { padding-inline: var(--space-4); }
      .header-inner { padding-block: var(--space-3) var(--space-2); }
      .brand-mark { width: 36px; height: 36px; }
      .brand-name { font-size: 22px; }
      .refresh-note { display: none; }
      .summary-strip { margin-top: var(--space-2); padding-top: var(--space-2); gap: 4px var(--space-4); }
      .summary-item.status-item { display: none; }
      main { padding-block: var(--space-3) calc(88px + env(safe-area-inset-bottom)); }
      .board-heading { margin-bottom: var(--space-3); }
      .board-heading h1 { font-size: 19px; }

      /* Add Task floats within thumb reach */
      .primary-button {
        position: fixed;
        z-index: 4;
        right: max(var(--space-4), env(safe-area-inset-right));
        bottom: calc(var(--space-4) + env(safe-area-inset-bottom));
        min-height: 52px;
        padding: 0 22px;
        border: 0;
        border-radius: 26px;
        background: #8f3e05;
        color: #fff;
        font-size: 16px;
        box-shadow: 0 6px 18px rgb(16 42 67 / 35%);
      }
      .primary-button:hover { background: #743204; }
      .header-actions { width: auto; }

      /* Filters sit behind a toggle */
      .filter-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        min-height: 44px;
        margin-bottom: var(--space-3);
        padding: 0 var(--space-4);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--blue-800);
        font-weight: 700;
      }
      .filter-toggle[aria-expanded="true"] { margin-bottom: var(--space-2); }
      .filters { display: none; flex-direction: column; align-items: stretch; }
      .filters.is-open { display: flex; }
      .filter-field { min-width: 0; }
      .filter-field label { font-size: 12px; }
      .filter-field input, .filter-field select, .clear-button { min-height: 44px; font-size: 16px; }

      /* One status column at a time, chosen from a sticky tab bar */
      .status-tabs {
        position: sticky;
        top: 0;
        z-index: 3;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: var(--space-1);
        margin: 0 calc(var(--space-4) * -1) var(--space-3);
        padding: var(--space-2) var(--space-4);
        background: var(--canvas);
        border-bottom: 1px solid var(--line);
      }
      .status-tab {
        display: grid;
        justify-items: center;
        gap: 2px;
        min-height: 56px;
        padding: 6px 2px;
        border: 0;
        border-bottom: 3px solid transparent;
        border-radius: 4px 4px 0 0;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
      }
      .status-tab .tab-count {
        min-width: 28px;
        padding: 1px 8px;
        border-radius: 12px;
        background: #e1e9f0;
        color: var(--blue-900);
        font-size: 15px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .status-tab.has-overdue .tab-count { background: var(--critical-bg); color: var(--critical); box-shadow: inset 0 0 0 1px #f0b8b3; }
      .status-tab[aria-pressed="true"] { border-bottom-color: #c2570c; color: var(--blue-950); background: var(--surface); }
      .board { grid-template-columns: minmax(0, 1fr); }
      .board-column { display: none; min-height: 0; padding: 0; border: 0; border-radius: 0; background: transparent; }
      .board-column.is-active { display: block; }
      .column-header { display: none; }
      .card-list { gap: var(--space-3); }

      /* Larger cards and touch targets */
      .task-card { padding: 14px; }
      .task-id { font-size: 11px; }
      .card-title { font-size: 16px; margin: 8px 0 4px; }
      .project-name { font-size: 13px; }
      .priority-pill, .category-tag, .overdue-badge { font-size: 12px; padding: 3px 8px; }
      .card-meta-row { font-size: 13px; }
      .card-footer { flex-wrap: wrap; gap: var(--space-2) var(--space-3); margin-top: 12px; padding-top: 10px; }
      .due-date { font-size: 13px; }
      .move-select { max-width: 140px; min-height: 44px; padding: 0 8px; font-size: 14px; }
      .icon-button { width: 44px; height: 44px; font-size: 24px; }
      .delete-confirm { font-size: 14px; }
      .delete-confirm button { min-height: 44px; min-width: 56px; font-size: 14px; }
      .empty-column { padding: 40px 8px; font-size: 14px; }

      /* Add-task dialog becomes a bottom sheet */
      dialog {
        width: 100%;
        max-width: 100%;
        max-height: 92dvh;
        margin: auto 0 0;
        border-radius: 14px 14px 0 0;
      }
      .form-grid { grid-template-columns: 1fr; }
      .form-field.full-width { grid-column: auto; }
      .form-field label { font-size: 13px; }
      .form-field input, .form-field select, .form-field textarea { min-height: 46px; font-size: 16px; }
      .dialog-header, .dialog-body { padding-inline: var(--space-4); }
      .dialog-body { padding-bottom: calc(var(--space-5) + env(safe-area-inset-bottom)); }
      .form-actions { position: sticky; bottom: 0; padding-top: var(--space-2); background: var(--surface); }
      .form-actions button { flex: 1; min-height: 48px; font-size: 16px; }

      /* Toasts clear the floating button */
      .toast-region { right: var(--space-4); left: var(--space-4); bottom: calc(84px + env(safe-area-inset-bottom)); width: auto; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto; animation-duration: .01ms; animation-iteration-count: 1; transition-duration: .01ms; }
      .toast { animation: none; }
      .board-column { transition: none; }
    }
  </style>
</head>
<body>
  <!-- Application header and live summary -->
  <header class="app-header">
    <div class="header-inner">
      <div class="topline">
        <div class="brand" aria-label="IT PMO internal project delivery board">
          <div class="brand-mark" aria-hidden="true">IT</div>
          <div>
            <p class="brand-name">IT PMO</p>
            <p class="brand-subtitle">Project delivery board · Internal demo</p>
          </div>
        </div>
        <div class="header-actions">
          <span class="refresh-note">Demo board resets to seeded data on refresh</span>
          <button class="primary-button" id="openAddTask" type="button"><span aria-hidden="true">+</span> Add Task</button>
        </div>
      </div>
      <div class="summary-strip" id="summaryStrip" aria-label="Board summary"></div>
    </div>
  </header>

  <!-- Board filters and task columns -->
  <main>
    <section aria-labelledby="boardTitle">
      <div class="board-heading">
        <div>
          <h1 id="boardTitle">Delivery overview</h1>
          <p>Internal technology initiatives and delivery workstreams</p>
        </div>
      </div>
      <button class="filter-toggle" id="toggleFilters" type="button" aria-expanded="false" aria-controls="filterForm"><span id="filterToggleLabel">Filters</span><span aria-hidden="true">▾</span></button>
      <form class="filters" id="filterForm" aria-label="Filter tasks">
        <div class="filter-field">
          <label for="filterProject">Project / Workstream</label>
          <select id="filterProject"><option value="">All projects</option></select>
        </div>
        <div class="filter-field">
          <label for="filterAssignee">Assignee</label>
          <input id="filterAssignee" type="search" placeholder="Contains name…" autocomplete="off">
        </div>
        <div class="filter-field">
          <label for="filterPriority">Priority</label>
          <select id="filterPriority">
            <option value="">All priorities</option>
            <option>Critical</option><option>High</option><option>Medium</option><option>Low</option>
          </select>
        </div>
        <button class="clear-button" id="clearFilters" type="button">Clear filters</button>
      </form>
      <div class="status-tabs" id="statusTabs" role="group" aria-label="Show tasks by status"></div>
      <div class="board" id="board" aria-label="Kanban board"></div>
    </section>
  </main>

  <!-- Task entry dialog -->
  <dialog id="taskDialog" aria-labelledby="dialogTitle">
    <div class="dialog-header">
      <h2 id="dialogTitle">Add task</h2>
      <button class="icon-button" id="closeDialog" type="button" aria-label="Close add task form">×</button>
    </div>
    <div class="dialog-body">
      <form id="taskForm" novalidate>
        <div class="form-grid">
          <div class="form-field full-width">
            <label for="taskTitle">Task Title <span aria-hidden="true">*</span></label>
            <input id="taskTitle" name="title" type="text" maxlength="80" required aria-describedby="error-title">
            <span class="field-error" id="error-title"></span>
          </div>
          <div class="form-field full-width">
            <label for="taskDescription">Description</label>
            <textarea id="taskDescription" name="description" maxlength="500" aria-describedby="error-description"></textarea>
            <span class="field-error" id="error-description"></span>
          </div>
          <div class="form-field">
            <label for="taskProject">Project / Workstream <span aria-hidden="true">*</span></label>
            <select id="taskProject" name="project" required aria-describedby="error-project"></select>
            <span class="field-error" id="error-project"></span>
          </div>
          <div class="form-field">
            <label for="taskCategory">Category <span aria-hidden="true">*</span></label>
            <select id="taskCategory" name="category" required aria-describedby="error-category"></select>
            <span class="field-error" id="error-category"></span>
          </div>
          <div class="form-field">
            <label for="taskAssignee">Assignee <span aria-hidden="true">*</span></label>
            <input id="taskAssignee" name="assignee" type="text" maxlength="80" required aria-describedby="error-assignee">
            <span class="field-error" id="error-assignee"></span>
          </div>
          <div class="form-field">
            <label for="taskPriority">Priority <span aria-hidden="true">*</span></label>
            <select id="taskPriority" name="priority" required aria-describedby="error-priority">
              <option>Critical</option><option>High</option><option selected>Medium</option><option>Low</option>
            </select>
            <span class="field-error" id="error-priority"></span>
          </div>
          <div class="form-field">
            <label for="taskDueDate">Due Date <span aria-hidden="true">*</span></label>
            <input id="taskDueDate" name="dueDate" type="date" required aria-describedby="error-dueDate">
            <span class="field-error" id="error-dueDate"></span>
          </div>
          <div class="form-field">
            <label for="taskStatus">Status <span aria-hidden="true">*</span></label>
            <select id="taskStatus" name="status" required aria-describedby="error-status">
              <option selected>Backlog</option><option>In Progress</option><option>Blocked</option><option>Done</option>
            </select>
            <span class="field-error" id="error-status"></span>
          </div>
        </div>
        <div class="form-actions">
          <button class="secondary-button" id="cancelTask" type="button">Close</button>
          <button class="submit-button" id="submitTask" type="submit">Add task</button>
        </div>
      </form>
    </div>
  </dialog>

  <!-- Accessible transient feedback -->
  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>

  <!-- FormSubmit requires one-time activation: the first submission triggers a confirmation email to the configured address, and delivery starts only after its link is clicked. -->
  <script>
    "use strict";

    // Replace the placeholder recipient here to configure FormSubmit.
    const FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/YOUR_EMAIL@example.com";

    // Board data and static options
    const STATUSES = ["Backlog", "In Progress", "Blocked", "Done"];
    const PROJECTS = ["Core Banking Upgrade", "Digital Channels", "Cybersecurity Uplift", "Data & Analytics", "Infrastructure & Cloud", "Vendor Management"];
    const CATEGORIES = ["Application Development", "Infrastructure", "Cybersecurity", "Data", "Compliance", "Vendor"];
    const state = { tasks: [], filters: {}, activeStatus: "In Progress" };
    let draggedTaskId = null;
    let nextTaskNumber = 9;

    function dateOffset(days) {
      const date = new Date();
      date.setDate(date.getDate() + days);
      return [date.getFullYear(), String(date.getMonth() + 1).padStart(2, "0"), String(date.getDate()).padStart(2, "0")].join("-");
    }

    function seedTasks() {
      state.tasks = [
        { id: "UOB-ITPM-0001", title: "Migrate FX pricing service to AWS", description: "Move the pricing service and validate latency and failover controls.", project: "Infrastructure & Cloud", category: "Infrastructure", assignee: "Amelia Tan", priority: "High", dueDate: dateOffset(-2), status: "Backlog" },
        { id: "UOB-ITPM-0002", title: "Patch CVE-2025-XXXX on branch teller VDI", description: "Roll out the approved endpoint patch across teller virtual desktops.", project: "Cybersecurity Uplift", category: "Cybersecurity", assignee: "Ravi Menon", priority: "Critical", dueDate: dateOffset(1), status: "In Progress" },
        { id: "UOB-ITPM-0003", title: "UAT sign-off for mobile onboarding release 4.2", description: "Collect business acceptance and close remaining UAT observations.", project: "Digital Channels", category: "Application Development", assignee: "Chloe Lim", priority: "High", dueDate: dateOffset(3), status: "In Progress" },
        { id: "UOB-ITPM-0004", title: "Confirm vendor DR test evidence", description: "Awaiting the infrastructure vendor's completed recovery test pack.", project: "Vendor Management", category: "Vendor", assignee: "Daniel Wong", priority: "Medium", dueDate: dateOffset(-1), status: "Blocked" },
        { id: "UOB-ITPM-0005", title: "Reconcile customer data lineage controls", description: "Map critical reporting fields to their authoritative source systems.", project: "Data & Analytics", category: "Data", assignee: "Nur Aisyah", priority: "Medium", dueDate: dateOffset(6), status: "Backlog" },
        { id: "UOB-ITPM-0006", title: "Complete core ledger interface regression", description: "Run end-to-end regression for the ledger integration release.", project: "Core Banking Upgrade", category: "Application Development", assignee: "Marcus Lee", priority: "Critical", dueDate: dateOffset(2), status: "In Progress" },
        { id: "UOB-ITPM-0007", title: "Approve encryption key rotation procedure", description: "Security and operations have approved the runbook and evidence.", project: "Cybersecurity Uplift", category: "Compliance", assignee: "Priya Nair", priority: "Low", dueDate: dateOffset(-4), status: "Done" },
        { id: "UOB-ITPM-0008", title: "Provision analytics sandbox capacity", description: "Size the isolated environment for the next reporting workstream.", project: "Data & Analytics", category: "Infrastructure", assignee: "Ethan Goh", priority: "Low", dueDate: dateOffset(10), status: "Backlog" }
      ];
    }

    // Safe HTML and display helpers
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[character]);
    }

    function localToday() {
      return dateOffset(0);
    }

    function formatDate(value) {
      const [year, month, day] = value.split("-").map(Number);
      return new Intl.DateTimeFormat("en", { day: "numeric", month: "short", year: "numeric" }).format(new Date(year, month - 1, day));
    }

    function isOverdue(task) {
      return task.status !== "Done" && task.dueDate < localToday();
    }

    function getFilteredTasks() {
      const assignee = (state.filters.assignee || "").trim().toLocaleLowerCase();
      return state.tasks.filter(task =>
        (!state.filters.project || task.project === state.filters.project) &&
        (!assignee || task.assignee.toLocaleLowerCase().includes(assignee)) &&
        (!state.filters.priority || task.priority === state.filters.priority)
      );
    }

    // Render all board content from the in-memory state
    function renderCard(task) {
      const priorityClass = task.priority.toLowerCase();
      const overdue = isOverdue(task);
      const moveOptions = STATUSES.filter(status => status !== task.status)
        .map(status => `<option value="${escapeHtml(status)}">${escapeHtml(status)}</option>`).join("");
      const deletionControl = task.deletePending
        ? `<div class="delete-confirm" role="group" aria-label="Confirm deletion"><span>Delete this task?</span><span><button type="button" data-action="confirm-delete" data-task-id="${escapeHtml(task.id)}">Yes</button> <button type="button" data-action="cancel-delete" data-task-id="${escapeHtml(task.id)}">No</button></span></div>`
        : `<div class="card-actions"><label class="sr-only" for="move-${escapeHtml(task.id)}">Move ${escapeHtml(task.id)} to another column</label><select class="move-select" id="move-${escapeHtml(task.id)}" data-action="move" data-task-id="${escapeHtml(task.id)}"><option value="">Move ▸</option>${moveOptions}</select><button class="icon-button" type="button" data-action="ask-delete" data-task-id="${escapeHtml(task.id)}" aria-label="Delete ${escapeHtml(task.id)}">×</button></div>`;
      return `<article class="task-card priority-${escapeHtml(priorityClass)}" draggable="true" data-task-id="${escapeHtml(task.id)}" aria-label="${escapeHtml(task.title)}, ${escapeHtml(task.priority)} priority, ${escapeHtml(task.status)}">
        <div class="card-topline"><span class="task-id">${escapeHtml(task.id)}</span>${overdue ? '<span class="overdue-badge">Overdue</span>' : ""}</div>
        <h3 class="card-title">${escapeHtml(task.title)}</h3>
        <p class="project-name">${escapeHtml(task.project)}</p>
        <div class="card-topline"><span class="priority-pill ${escapeHtml(priorityClass)}">${escapeHtml(task.priority)} priority</span><span class="category-tag">${escapeHtml(task.category)}</span></div>
        <div class="card-meta-row"><span>Owner:</span><span class="assignee">${escapeHtml(task.assignee)}</span></div>
        <div class="card-footer"><span class="due-date">Due ${escapeHtml(formatDate(task.dueDate))}</span>${deletionControl}</div>
      </article>`;
    }

    function renderBoard() {
      const board = document.getElementById("board");
      const visibleTasks = getFilteredTasks();
      const summary = document.getElementById("summaryStrip");
      const statusCounts = Object.fromEntries(STATUSES.map(status => [status, state.tasks.filter(task => task.status === status).length]));
      const overdueCount = state.tasks.filter(isOverdue).length;
      summary.innerHTML = `<span class="summary-item"><strong>${state.tasks.length}</strong> Total tasks</span>${STATUSES.map(status => `<span class="summary-item status-item"><strong>${statusCounts[status]}</strong> ${escapeHtml(status)}</span>`).join("")}<span class="summary-item overdue"><strong>${overdueCount}</strong> Overdue</span>`;
      board.innerHTML = STATUSES.map(status => {
        const tasks = visibleTasks.filter(task => task.status === status);
        return `<section class="board-column${status === state.activeStatus ? " is-active" : ""}" data-status="${escapeHtml(status)}" aria-label="${escapeHtml(status)} tasks">
          <header class="column-header"><h2>${escapeHtml(status)}</h2><span class="count-badge" aria-label="${tasks.length} tasks">${tasks.length}</span></header>
          <div class="card-list">${tasks.length ? tasks.map(renderCard).join("") : '<div class="empty-column">No tasks</div>'}</div>
        </section>`;
      }).join("");
      if (state.tasks.length && !visibleTasks.length) {
        board.innerHTML = '<div class="empty-filter">No tasks match these filters.</div>';
      }
      document.getElementById("statusTabs").innerHTML = STATUSES.map(status => {
        const tasks = visibleTasks.filter(task => task.status === status);
        const overdue = tasks.filter(isOverdue).length;
        const label = `${status}, ${tasks.length} tasks${overdue ? `, ${overdue} overdue` : ""}`;
        return `<button class="status-tab${overdue ? " has-overdue" : ""}" type="button" data-status="${escapeHtml(status)}" aria-pressed="${status === state.activeStatus}" aria-label="${escapeHtml(label)}"><span class="tab-count">${tasks.length}</span><span>${escapeHtml(status)}</span></button>`;
      }).join("");
      const activeFilters = ["project", "assignee", "priority"].filter(key => (state.filters[key] || "").trim()).length;
      document.getElementById("filterToggleLabel").textContent = activeFilters ? `Filters (${activeFilters} active)` : "Filters";
    }

    function handleTabClick(event) {
      const tab = event.target.closest(".status-tab");
      if (!tab) return;
      state.activeStatus = tab.dataset.status;
      renderBoard();
      document.querySelector(`.status-tab[data-status="${CSS.escape(state.activeStatus)}"]`)?.focus();
    }

    function toggleFilters() {
      const toggle = document.getElementById("toggleFilters");
      const open = toggle.getAttribute("aria-expanded") !== "true";
      toggle.setAttribute("aria-expanded", String(open));
      document.getElementById("filterForm").classList.toggle("is-open", open);
    }

    // Task status and deletion actions
    function moveTask(taskId, targetStatus) {
      if (!STATUSES.includes(targetStatus)) return;
      const task = state.tasks.find(item => item.id === taskId);
      if (!task || task.status === targetStatus) return;
      task.status = targetStatus;
      task.deletePending = false;
      renderBoard();
      showToast(`Moved ${task.id} to ${targetStatus}.`);
    }

    function deleteTask(taskId) {
      const task = state.tasks.find(item => item.id === taskId);
      if (!task) return;
      state.tasks = state.tasks.filter(item => item.id !== taskId);
      renderBoard();
      showToast(`Deleted ${task.id}.`);
    }

    function handleBoardClick(event) {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const task = state.tasks.find(item => item.id === button.dataset.taskId);
      if (!task) return;
      if (button.dataset.action === "ask-delete") {
        task.deletePending = true;
        renderBoard();
        document.querySelector(`[data-action="confirm-delete"][data-task-id="${CSS.escape(task.id)}"]`)?.focus();
      } else if (button.dataset.action === "confirm-delete") {
        deleteTask(task.id);
      } else if (button.dataset.action === "cancel-delete") {
        task.deletePending = false;
        renderBoard();
        document.querySelector(`[data-action="ask-delete"][data-task-id="${CSS.escape(task.id)}"]`)?.focus();
      }
    }

    function handleBoardChange(event) {
      const select = event.target.closest('select[data-action="move"]');
      if (!select || !select.value) return;
      moveTask(select.dataset.taskId, select.value);
    }

    function handleDragStart(event) {
      const card = event.target.closest(".task-card");
      if (!card) return;
      draggedTaskId = card.dataset.taskId;
      card.classList.add("is-dragging");
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", draggedTaskId);
    }

    function handleDragEnd(event) {
      event.target.closest(".task-card")?.classList.remove("is-dragging");
      document.querySelectorAll(".board-column.is-drop-target").forEach(column => column.classList.remove("is-drop-target"));
      draggedTaskId = null;
    }

    function handleDragOver(event) {
      const column = event.target.closest(".board-column");
      if (!column) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = "move";
      document.querySelectorAll(".board-column.is-drop-target").forEach(item => {
        if (item !== column) item.classList.remove("is-drop-target");
      });
      column.classList.add("is-drop-target");
    }

    function handleDrop(event) {
      const column = event.target.closest(".board-column");
      if (!column) return;
      event.preventDefault();
      column.classList.remove("is-drop-target");
      const taskId = event.dataTransfer.getData("text/plain") || draggedTaskId;
      moveTask(taskId, column.dataset.status);
    }

    // Filtering controls
    function applyFilters() {
      state.filters.project = document.getElementById("filterProject").value;
      state.filters.assignee = document.getElementById("filterAssignee").value;
      state.filters.priority = document.getElementById("filterPriority").value;
      renderBoard();
    }

    function populateOptions() {
      const projectFilter = document.getElementById("filterProject");
      const projectSelect = document.getElementById("taskProject");
      const categorySelect = document.getElementById("taskCategory");
      projectFilter.innerHTML += PROJECTS.map(project => `<option value="${escapeHtml(project)}">${escapeHtml(project)}</option>`).join("");
      projectSelect.innerHTML = `<option value="">Select a project</option>${PROJECTS.map(project => `<option value="${escapeHtml(project)}">${escapeHtml(project)}</option>`).join("")}`;
      categorySelect.innerHTML = `<option value="">Select a category</option>${CATEGORIES.map(category => `<option value="${escapeHtml(category)}">${escapeHtml(category)}</option>`).join("")}`;
    }

    // Inline validation and optimistic task submission
    const FIELD_IDS = ["title", "description", "project", "category", "assignee", "priority", "dueDate", "status"];

    function validateTaskForm(formData) {
      const errors = {};
      if (!formData.get("title").trim()) errors.title = "Enter a task title.";
      if (formData.get("title").length > 80) errors.title = "Use 80 characters or fewer.";
      if (formData.get("description").length > 500) errors.description = "Use 500 characters or fewer.";
      if (!formData.get("project")) errors.project = "Select a project or workstream.";
      if (!formData.get("category")) errors.category = "Select a category.";
      if (!formData.get("assignee").trim()) errors.assignee = "Enter an assignee.";
      if (!formData.get("priority")) errors.priority = "Select a priority.";
      if (!formData.get("dueDate")) errors.dueDate = "Select a due date.";
      else if (formData.get("dueDate") < localToday()) errors.dueDate = "Due date cannot be in the past.";
      if (!STATUSES.includes(formData.get("status"))) errors.status = "Select a status.";
      return errors;
    }

    function displayErrors(errors) {
      FIELD_IDS.forEach(field => {
        const control = document.getElementById(`task${field[0].toUpperCase()}${field.slice(1)}`);
        const error = document.getElementById(`error-${field}`);
        const message = errors[field] || "";
        control.setAttribute("aria-invalid", String(Boolean(message)));
        error.textContent = message;
      });
      const firstInvalid = FIELD_IDS.find(field => errors[field]);
      if (firstInvalid) document.getElementById(`task${firstInvalid[0].toUpperCase()}${firstInvalid.slice(1)}`).focus();
    }

    async function notifyNewTask(task) {
      const res = await fetch(FORMSUBMIT_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({
          _subject: `[UOB IT PMO] New task ${task.id}: ${task.title}`,
          _template: "table",
          _captcha: "false",
          "Task ID": task.id,
          Title: task.title,
          Description: task.description,
          Project: task.project,
          Category: task.category,
          Assignee: task.assignee,
          Priority: task.priority,
          "Due Date": task.dueDate,
          Status: task.status,
          "Submitted At": new Date().toISOString()
        })
      });
      if (!res.ok) throw new Error(`FormSubmit failed: ${res.status}`);
      return res.json();
    }

    async function addTask(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const formData = new FormData(form);
      const errors = validateTaskForm(formData);
      displayErrors(errors);
      if (Object.keys(errors).length) return;

      const task = {
        id: `UOB-ITPM-${String(nextTaskNumber++).padStart(4, "0")}`,
        title: formData.get("title").trim(),
        description: formData.get("description").trim(),
        project: formData.get("project"),
        category: formData.get("category"),
        assignee: formData.get("assignee").trim(),
        priority: formData.get("priority"),
        dueDate: formData.get("dueDate"),
        status: formData.get("status"),
        deletePending: false
      };
      state.tasks.push(task);
      renderBoard();
      form.reset();
      document.getElementById("taskPriority").value = "Medium";
      document.getElementById("taskStatus").value = "Backlog";
      document.getElementById("taskDueDate").min = localToday();
      displayErrors({});
      showToast(`Task ${task.id} added to the board.`);

      const submitButton = document.getElementById("submitTask");
      submitButton.disabled = true;
      submitButton.textContent = "Sending…";
      try {
        await notifyNewTask(task);
      } catch (error) {
        showToast("Card added locally — email notification failed", "warning");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Add task";
        const dialog = document.getElementById("taskDialog");
        if (dialog.open) dialog.close();
      }
    }

    // Toasts and form dialog controls
    function showToast(message, type = "success") {
      const region = document.getElementById("toastRegion");
      const toast = document.createElement("div");
      toast.className = `toast${type === "warning" ? " warning" : ""}`;
      toast.setAttribute("role", type === "warning" ? "status" : "status");
      toast.textContent = message;
      region.append(toast);
      window.setTimeout(() => toast.remove(), 4400);
    }

    function openTaskDialog() {
      document.getElementById("taskDueDate").min = localToday();
      document.getElementById("taskDialog").showModal();
      document.getElementById("taskTitle").focus();
    }

    function closeTaskDialog() {
      const dialog = document.getElementById("taskDialog");
      dialog.close();
    }

    // Wire interactions and initialize seeded demo data
    function initialize() {
      seedTasks();
      populateOptions();
      renderBoard();

      document.getElementById("openAddTask").addEventListener("click", openTaskDialog);
      document.getElementById("closeDialog").addEventListener("click", closeTaskDialog);
      document.getElementById("cancelTask").addEventListener("click", closeTaskDialog);
      document.getElementById("taskForm").addEventListener("submit", addTask);
      document.getElementById("statusTabs").addEventListener("click", handleTabClick);
      document.getElementById("toggleFilters").addEventListener("click", toggleFilters);
      document.getElementById("filterForm").addEventListener("input", applyFilters);
      document.getElementById("filterForm").addEventListener("change", applyFilters);
      document.getElementById("clearFilters").addEventListener("click", () => {
        document.getElementById("filterForm").reset();
        applyFilters();
      });

      const board = document.getElementById("board");
      board.addEventListener("click", handleBoardClick);
      board.addEventListener("change", handleBoardChange);
      board.addEventListener("dragstart", handleDragStart);
      board.addEventListener("dragend", handleDragEnd);
      board.addEventListener("dragover", handleDragOver);
      board.addEventListener("dragleave", event => {
        const column = event.target.closest(".board-column");
        if (column && !column.contains(event.relatedTarget)) column.classList.remove("is-drop-target");
      });
      board.addEventListener("drop", handleDrop);
      document.getElementById("taskForm").addEventListener("input", event => {
        if (event.target.hasAttribute("aria-invalid")) {
          event.target.removeAttribute("aria-invalid");
          document.getElementById(`error-${event.target.name}`).textContent = "";
        }
      });
    }

    initialize();
  </script>
</body>
</html>
